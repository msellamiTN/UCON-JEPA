SPECIFICATION Spec

CONSTANTS
  Writers = {"w1", "w2"}
  EventIdByWriter = [w1 |-> "event-1", w2 |-> "event-2"]
  EvaluationIdByWriter = [w1 |-> "evaluation-1", w2 |-> "evaluation-2"]

INVARIANTS
  TypeOK
  NoDuplicateEventCommit
  CommitRecordWellFormed
  AcknowledgementRequiresDurability
  ReplayRejectionRequiresPriorCommit
  LockConsistency
