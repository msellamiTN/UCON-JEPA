name: G8.4.1 JEPA Role Contract
on:
  push:
    branches:
      - main
      - research/g8.4.1-jepa-role-contract
    paths:
      - "experiments/G8.4/**"
      - "docs/research/G8.4.1_JEPA_ROLE_CONTRACT.md"
      - ".github/workflows/g8-4-1-jepa-role-contract.yml"
  pull_request:
    paths:
      - "experiments/G8.4/**"
      - "docs/research/G8.4.1_JEPA_ROLE_CONTRACT.md"
      - ".github/workflows/g8-4-1-jepa-role-contract.yml"
  workflow_dispatch:

jobs:
  jepa-role-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JEPA reference-model dependency
        run: python -m pip install numpy
      - name: Validate JEPA role and authority contracts
        working-directory: experiments/G8.4
        run: python -m unittest -v
