name: G8.4.8.7.7 Temporal Support Alignment Audit

on:
  push:
    branches:
      - research/g8.4.8.7.7-temporal-support-alignment
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-7-7-temporal-support-alignment.yml"
  pull_request:
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-7-7-temporal-support-alignment.yml"
  workflow_dispatch:

jobs:
  temporal-support-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Run complete G8.4 regression suite
        working-directory: experiments/G8.4
        run: python -m unittest discover -v
      - name: Run focused temporal-support tests
        working-directory: experiments/G8.4
        run: python -m unittest -v test_policy_shift_temporal_support_alignment.py
      - name: Execute five-seed temporal-support benchmark
        working-directory: experiments/G8.4
        run: python policy_shift_temporal_support_alignment.py --seeds 20261120,20261121,20261122,20261123,20261124 --episodes-per-cell 300 --epochs 180 --mc-samples 32 --bootstrap-replicates 2000 --out temporal-support-alignment-output
      - name: Retain datasets and temporal-support evidence
        uses: actions/upload-artifact@v4
        with:
          name: g8-4-8-7-7-temporal-support-alignment
          path: experiments/G8.4/temporal-support-alignment-output/
