name: G8.4.8.7.2 Policy Shift Action Baselines

on:
  push:
    branches:
      - research/g8.4.8.7.2-policy-shift-action-baselines
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-7-2-policy-shift-action-baselines.yml"
  pull_request:
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-7-2-policy-shift-action-baselines.yml"
  workflow_dispatch:

jobs:
  policy-shift-action-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Run all G8.4 regression tests
        working-directory: experiments/G8.4
        run: python -m unittest discover -v
      - name: Execute policy-shift action baseline tests
        working-directory: experiments/G8.4
        run: python -m unittest -v test_policy_shift_action_baselines.py
      - name: Run five-seed full action prediction benchmark
        working-directory: experiments/G8.4
        run: python policy_shift_action_baselines.py --seeds 20261120,20261121,20261122,20261123,20261124 --episodes-per-cell 300 --max-epochs 150 --patience 15 --bootstrap-replicates 2000 --out policy-shift-action-baseline-output
      - name: Retain full datasets, checksums, metrics and bootstrap intervals
        uses: actions/upload-artifact@v4
        with:
          name: g8-4-8-7-2-policy-shift-action-baselines
          path: experiments/G8.4/policy-shift-action-baseline-output/
