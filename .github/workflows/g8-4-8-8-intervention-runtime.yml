name: G8.4.8.8 Intervention Runtime Contract

on:
  push:
    branches:
      - research/g8.4.8.8-causal-intervention-utility
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-8-intervention-runtime.yml"
  pull_request:
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-8-intervention-runtime.yml"
  workflow_dispatch:

jobs:
  intervention-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install G8.4 test dependencies
        run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Run complete G8.4 regression suite
        working-directory: experiments/G8.4
        run: python -m unittest discover -v
      - name: Run focused intervention runtime contract tests
        working-directory: experiments/G8.4
        run: python -m unittest -v test_intervention_runtime.py
      - name: Compile intervention runtime and tests
        run: python -m compileall -q experiments/G8.4/intervention_runtime.py experiments/G8.4/test_intervention_runtime.py
