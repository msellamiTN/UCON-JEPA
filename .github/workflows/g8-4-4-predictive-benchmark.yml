name: G8.4.4 Predictive Benchmark
on:
  push:
    branches:
      - main
      - research/g8.4.4-matched-predictive-benchmark
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-4-predictive-benchmark.yml"
  pull_request:
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-4-predictive-benchmark.yml"
  workflow_dispatch:

jobs:
  predictive-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Unit tests
        working-directory: experiments/G8.4
        run: python -m unittest -v
      - name: Run deterministic multi-seed benchmark
        working-directory: experiments/G8.4
        run: python predictive_benchmark.py --seeds 2026 2027 2028 --episodes-per-family 200 --epochs 100 --out benchmark-output
      - name: Retain benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: g8-4-4-predictive-benchmark
          path: experiments/G8.4/benchmark-output/predictive_benchmark.json
