name: G8.4.8.8 Power-Gated Confirmatory Trial

on:
  workflow_dispatch:
    inputs:
      power_run_id:
        description: Completed max-t power-gate workflow run ID
        required: true
      approval_reference:
        description: Explicit PI/domain-owner approval reference for task semantics, margins and target effects
        required: true
      confirmatory_seeds:
        description: Five preregistered confirmatory seeds
        required: true
        default: "20261120,20261121,20261122,20261123,20261124"
      episodes_per_cell:
        description: Training episodes per policy-parameter cell
        required: true
        default: "300"
      epochs:
        description: Model training epochs
        required: true
        default: "180"
      mc_samples:
        description: Monte Carlo samples per E2 risk score
        required: true
        default: "32"

permissions:
  actions: read
  contents: read

jobs:
  confirmatory-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UCON_JEPA_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependencies
        run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Run complete G8.4 regression suite
        working-directory: experiments/G8.4
        run: python -m unittest discover -v
      - name: Download approved max-t power report
        uses: actions/download-artifact@v4
        with:
          name: g8-4-8-8-max-t-power-gate
          path: power-artifact
          run-id: ${{ inputs.power_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run power-gated confirmatory four-arm trial
        working-directory: experiments/G8.4
        run: |
          python intervention_confirmatory.py \
            --power-report '../../power-artifact/sample_size_gate.json' \
            --confirmatory-seeds '${{ inputs.confirmatory_seeds }}' \
            --episodes-per-cell '${{ inputs.episodes_per_cell }}' \
            --epochs '${{ inputs.epochs }}' \
            --mc-samples '${{ inputs.mc_samples }}' \
            --approval-reference '${{ inputs.approval_reference }}' \
            --out confirmatory-output
      - name: Retain frozen assignments, models and episode outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8-4-8-8-confirmatory-trial
          path: experiments/G8.4/confirmatory-output/
