name: TLA+ runtime enforcement model

on:
  push:
    paths:
      - "formal/tla/**"
      - "docs/verification/G6.3_TLA_MODEL.md"
      - ".github/workflows/tla-model-check.yml"
  pull_request:
    paths:
      - "formal/tla/**"
      - "docs/verification/G6.3_TLA_MODEL.md"
      - ".github/workflows/tla-model-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools artifacts
          curl --fail --location --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            --output .tools/tla2tools.jar
          echo "7e53aa636dac8a3cb0533f343115c0548e03fc0ce5edc7739becf58d3d0fb84f  .tools/tla2tools.jar" | sha256sum --check -

      - name: Parse TLA+ module
        shell: bash
        run: |
          set -o pipefail
          java -cp .tools/tla2tools.jar tla2sany.SANY formal/tla/G6_RuntimeEnforcement.tla \
            2>&1 | tee artifacts/sany.log

      - name: Run TLC
        shell: bash
        run: |
          set -o pipefail
          java -XX:+UseParallelGC -Xmx3g -jar .tools/tla2tools.jar \
            -config formal/tla/G6_RuntimeEnforcement.cfg \
            -workers 1 \
            formal/tla/G6_RuntimeEnforcement.tla \
            2>&1 | tee artifacts/tlc.log

      - name: Verify negative mutant controls
        shell: bash
        run: |
          set -euo pipefail
          run_mutant() {
            local name="$1"
            local config="$2"
            local expected="$3"
            local log="artifacts/$name.log"
            if java -XX:+UseParallelGC -Xmx3g -jar .tools/tla2tools.jar \
              -config "$config" -workers 1 \
              formal/tla/G6_RuntimeEnforcement.tla >"$log" 2>&1; then
              echo "ERROR: $name unexpectedly passed."
              cat "$log"
              exit 1
            fi
            if ! grep -q "$expected" "$log"; then
              echo "ERROR: $name failed for an unexpected reason."
              cat "$log"
              exit 1
            fi
            echo "$name: expected invariant violation detected ($expected)."
          }
          run_mutant M1 formal/tla/G6_M1_RevocationDisabled.cfg NoAcceptanceAfterRevocation
          run_mutant M2 formal/tla/G6_M2_PolicyFreshnessDisabled.cfg NoStalePolicyAcceptance
          run_mutant M3 formal/tla/G6_M3_UconDisabled.cfg NoUnauthorizedAcceptance
          run_mutant M4 formal/tla/G6_M4_VerificationDisabled.cfg CommitRequiresVerification

      - name: Parse G8.3.11 crash consistency model
        shell: bash
        run: |
          set -o pipefail
          java -cp .tools/tla2tools.jar tla2sany.SANY formal/tla/G8_3_11_CrashConsistency.tla \
            2>&1 | tee artifacts/g8-3-11-sany.log

      - name: Run G8.3.11 crash consistency TLC model
        shell: bash
        run: |
          set -o pipefail
          java -XX:+UseParallelGC -Xmx3g -jar .tools/tla2tools.jar \
            -config formal/tla/G8_3_11_CrashConsistency.cfg \
            -workers 1 \
            formal/tla/G8_3_11_CrashConsistency.tla \
            2>&1 | tee artifacts/g8-3-11-tlc.log

      - name: Verify G8.3.11 atomicity mutant is detected
        shell: bash
        run: |
          set -euo pipefail
          log="artifacts/g8-3-11-atomicity-mutant.log"
          if java -XX:+UseParallelGC -Xmx3g -jar .tools/tla2tools.jar \
            -config formal/tla/G8_3_11_CrashConsistency_mutant.cfg \
            -workers 1 \
            formal/tla/G8_3_11_CrashConsistency.tla >"$log" 2>&1; then
            echo "ERROR: G8.3.11 atomicity mutant unexpectedly passed."
            cat "$log"
            exit 1
          fi
          if ! grep -q "AtomicEventEvaluation" "$log"; then
            echo "ERROR: G8.3.11 mutant failed for an unexpected reason."
            cat "$log"
            exit 1
          fi
          echo "G8.3.11 atomicity mutant: expected invariant violation detected."

      - name: Parse G8.3.12 multi-writer replay model
        shell: bash
        run: |
          set -o pipefail
          java -cp .tools/tla2tools.jar tla2sany.SANY formal/tla/G8_3_12_MultiWriterReplay.tla \
            2>&1 | tee artifacts/g8-3-12-sany.log

      - name: Check duplicate and distinct multi-writer scenarios
        shell: bash
        run: |
          set -euo pipefail
          for scenario in duplicate distinct; do
            log="artifacts/g8-3-12-$scenario-tlc.log"
            java -XX:+UseParallelGC -Xmx3g -jar .tools/tla2tools.jar \
              -config "formal/tla/G8_3_12_MultiWriterReplay_$scenario.cfg" \
              -workers 1 \
              formal/tla/G8_3_12_MultiWriterReplay.tla 2>&1 | tee "$log"
            grep -q "Model checking completed. No error has been found." "$log"
          done

      - name: Verify G8.3.12 replay-bypass mutant is detected
        shell: bash
        run: |
          set -euo pipefail
          log="artifacts/g8-3-12-replay-bypass-mutant.log"
          if java -XX:+UseParallelGC -Xmx3g -jar .tools/tla2tools.jar \
            -config formal/tla/G8_3_12_MultiWriterReplay_mutant.cfg \
            -workers 1 \
            formal/tla/G8_3_12_MultiWriterReplay.tla >"$log" 2>&1; then
            echo "ERROR: G8.3.12 replay-bypass mutant unexpectedly passed."
            cat "$log"
            exit 1
          fi
          if ! grep -q "NoDuplicateEventCommit" "$log"; then
            echo "ERROR: G8.3.12 mutant failed for an unexpected reason."
            cat "$log"
            exit 1
          fi
          echo "G8.3.12 replay-bypass mutant: expected duplicate-commit invariant violation detected."

      - name: Upload model-checking logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-tla-validation-logs
          path: artifacts/
          if-no-files-found: warn
