name: G8.4.8.7.3 JEPA Action Representation

on:
  push:
    branches:
      - research/g8.4.8.7.3-jepa-action-representation
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-7-3-jepa-action-representation.yml"
  pull_request:
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-7-3-jepa-action-representation.yml"
  workflow_dispatch:

jobs:
  jepa-action-representation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Run all G8.4 regression tests
        working-directory: experiments/G8.4
        run: python -m unittest discover -v
      - name: Run one-step JEPA action representation tests
        working-directory: experiments/G8.4
        run: python -m unittest -v test_policy_shift_jepa_action.py
      - name: Execute five-seed full JEPA action representation benchmark
        working-directory: experiments/G8.4
        run: python policy_shift_jepa_action.py --seeds 20261120,20261121,20261122,20261123,20261124 --episodes-per-cell 300 --jepa-epochs 120 --baseline-epochs 150 --baseline-patience 15 --action-weight 0.5 --bootstrap-replicates 2000 --out policy-shift-jepa-action-output
      - name: Retain datasets, checksums, model comparisons and bootstrap intervals
        uses: actions/upload-artifact@v4
        with:
          name: g8-4-8-7-3-jepa-action-representation
          path: experiments/G8.4/policy-shift-jepa-action-output/
