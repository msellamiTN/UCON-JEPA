name: G8.4.8.7.6 JEPA Calibration Direction Diagnostics

on:
  push:
    branches:
      - research/g8.4.8.7.6-calibration-direction-diagnostics
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-7-6-calibration-direction-diagnostics.yml"
  pull_request:
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-7-6-calibration-direction-diagnostics.yml"
  workflow_dispatch:

jobs:
  calibration-direction-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Run complete G8.4 regression suite
        working-directory: experiments/G8.4
        run: python -m unittest discover -v
      - name: Run focused calibration diagnostic tests
        working-directory: experiments/G8.4
        run: python -m unittest -v test_policy_shift_calibration_diagnostics.py
      - name: Execute five-seed calibration-direction benchmark
        working-directory: experiments/G8.4
        run: python policy_shift_calibration_diagnostics.py --seeds 20261120,20261121,20261122,20261123,20261124 --episodes-per-cell 300 --epochs 180 --mc-samples 32 --out policy-shift-calibration-diagnostics
      - name: Retain datasets and calibration-direction evidence
        uses: actions/upload-artifact@v4
        with:
          name: g8-4-8-7-6-calibration-direction-diagnostics
          path: experiments/G8.4/policy-shift-calibration-diagnostics/
