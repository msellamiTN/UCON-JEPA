name: G7 adapter, identity, refinement, and recovery contract

on:
  push:
    paths:
      - "src/ucon_jepa/**"
      - "tests/G7/**"
      - ".github/workflows/g7-adapter-contract.yml"
  pull_request:
    paths:
      - "src/ucon_jepa/**"
      - "tests/G7/**"
      - ".github/workflows/g7-adapter-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run G7 adapter, identity, transactional, and refinement tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/G7 -p "test_*.py" -v

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ucon
          POSTGRES_PASSWORD: ucon_test_password
          POSTGRES_DB: ucon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucon -d ucon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run G7 PostgreSQL integration tests
        env:
          PYTHONPATH: src
          UCON_JEPA_TEST_POSTGRES_DSN: "postgresql://ucon:ucon_test_password@localhost:5432/ucon_test"
        run: python -m unittest discover -s tests/G7 -p "test_postgres_service.py" -v

      - name: Run G7 PostgreSQL outbox integration tests
        env:
          PYTHONPATH: src
          UCON_JEPA_TEST_POSTGRES_DSN: "postgresql://ucon:ucon_test_password@localhost:5432/ucon_test"
        run: python -m unittest discover -s tests/G7 -p "test_postgres_outbox.py" -v

      - name: Run G7 PostgreSQL failover-fencing integration tests
        env:
          PYTHONPATH: src
          UCON_JEPA_TEST_POSTGRES_DSN: "postgresql://ucon:ucon_test_password@localhost:5432/ucon_test"
        run: python -m unittest discover -s tests/G7 -p "test_postgres_failover.py" -v
