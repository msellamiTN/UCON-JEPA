name: G6 runtime contract tests

on:
  push:
    paths:
      - "tests/G6/**"
      - ".github/workflows/g6-runtime-contract.yml"
  pull_request:
    paths:
      - "tests/G6/**"
      - ".github/workflows/g6-runtime-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run runtime contract tests
        run: python -m unittest discover -s tests/G6 -p "test_*.py" -v
