name: UCON-JEPA validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r experiments/G5/requirements.txt
      - run: python -m unittest discover -s experiments/G5 -p "test_*.py"


  g6-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run G6 runtime contract tests
        run: python -m unittest discover -s tests/G6 -p "test_*.py" -v

  latex-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal TeX Live toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-pictures \
            lmodern
      - name: Build and verify all LaTeX dossiers
        working-directory: paper/formal
        shell: bash
        run: |
          set -euo pipefail
          for source in g4_proof_dossier.tex g6_runtime_assurance.tex g5_statistical_assurance.tex; do
            echo "=== Building $source ==="
            for pass in 1 2 3; do
              echo "--- pass $pass ---"
              pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "$source"
            done
            log="${source%.tex}.log"
            if grep -Eq 'There were undefined references|Reference .+ undefined' "$log"; then
              echo "ERROR: unresolved cross-references remain in $source"
              grep -E 'There were undefined references|Reference .+ undefined' "$log"
              exit 1
            fi
            pdf="${source%.tex}.pdf"
            test -s "$pdf"
            file "$pdf"
          done
