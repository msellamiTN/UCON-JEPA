name: UCON-JEPA validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r experiments/G5/requirements.txt
      - run: python -m unittest discover -s experiments/G5 -p "test_*.py"


  g6-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run G6 runtime contract tests
        run: python -m unittest discover -s tests/G6 -p "test_*.py" -v

  latex-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Build G4 proof dossier
        working-directory: paper/formal
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error g4_proof_dossier.tex
          pdflatex -interaction=nonstopmode -halt-on-error g4_proof_dossier.tex
      - name: Build G5 statistical assurance dossier
        working-directory: paper/formal
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error g5_statistical_assurance.tex
          pdflatex -interaction=nonstopmode -halt-on-error g5_statistical_assurance.tex
