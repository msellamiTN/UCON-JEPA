name: G8.4.8.7.1 Policy Parameter Dataset

on:
  push:
    branches:
      - research/g8.4.8.7.1-policy-parameter-dataset
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-7-1-policy-parameter-dataset.yml"
  pull_request:
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-7-1-policy-parameter-dataset.yml"
  workflow_dispatch:

jobs:
  policy-parameter-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Run all G8.4 regression tests
        working-directory: experiments/G8.4
        run: python -m unittest discover -v
      - name: Run controlled policy parameter dataset tests
        working-directory: experiments/G8.4
        run: python -m unittest -v test_policy_parameter_dataset.py
      - name: Generate five-seed smoke dataset
        working-directory: experiments/G8.4
        run: |
          for seed in 20261120 20261121 20261122 20261123 20261124; do
            python policy_parameter_dataset.py --seed "$seed" --episodes-per-cell 50 --out "policy-parameter-smoke/$seed"
          done
      - name: Retain parameter-shift smoke datasets and manifests
        uses: actions/upload-artifact@v4
        with:
          name: g8-4-8-7-1-policy-parameter-smoke
          path: experiments/G8.4/policy-parameter-smoke/
