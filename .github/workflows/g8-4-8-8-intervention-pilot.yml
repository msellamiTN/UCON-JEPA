name: G8.4.8.8 Arm-Blinded Intervention Pilot

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Separate pilot seeds (comma-separated; must not overlap confirmatory seeds)
        required: true
        default: "20261110,20261111"
      episodes_per_arm_per_stratum:
        description: Pilot episodes per arm within each seed × archetype × family × difficulty × rho block
        required: true
        default: "10"
      episodes_per_cell:
        description: Training episodes per policy-parameter cell
        required: true
        default: "300"
      epochs:
        description: Model training epochs
        required: true
        default: "180"
      mc_samples:
        description: Monte Carlo samples per E2 score
        required: true
        default: "32"

jobs:
  run-blinded-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UCON_JEPA_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependencies
        run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Run complete G8.4 regression suite before pilot
        working-directory: experiments/G8.4
        run: python -m unittest discover -v
      - name: Run arm-blinded nominal-support pilot
        working-directory: experiments/G8.4
        run: |
          python intervention_pilot.py \
            --seeds '${{ inputs.seeds }}' \
            --episodes-per-arm-per-stratum '${{ inputs.episodes_per_arm_per_stratum }}' \
            --episodes-per-cell '${{ inputs.episodes_per_cell }}' \
            --epochs '${{ inputs.epochs }}' \
            --mc-samples '${{ inputs.mc_samples }}' \
            --out intervention-pilot-output
      - name: Retain pilot evidence and model checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8-4-8-8-intervention-pilot
          path: experiments/G8.4/intervention-pilot-output/
