name: G8.4.6 Multi-step JEPA
on:
  push:
    branches:
      - main
      - research/g8.4.6-multistep-jepa
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-6-multistep.yml"
  pull_request:
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-6-multistep.yml"
  workflow_dispatch:

jobs:
  multistep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Unit and regression tests
        working-directory: experiments/G8.4
        run: python -m unittest -v
      - name: Run multi-step benchmark
        working-directory: experiments/G8.4
        run: python multistep_benchmark.py --seeds 2041 2042 2043 --episodes-per-family 1200 --epochs 100 --bootstrap-replicates 2000 --out multistep-output
      - name: Retain multi-step results
        uses: actions/upload-artifact@v4
        with:
          name: g8-4-6-multistep-benchmark
          path: experiments/G8.4/multistep-output/multistep_benchmark.json
