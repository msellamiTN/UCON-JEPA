name: G8.4.8.7.4 Recursive Risk Forecasting

on:
  push:
    branches:
      - research/g8.4.8.7.4-recursive-risk-forecasting
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-7-4-recursive-risk-forecasting.yml"
  pull_request:
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-7-4-recursive-risk-forecasting.yml"
  workflow_dispatch:

jobs:
  recursive-risk-forecasting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Run all G8.4 regression tests
        working-directory: experiments/G8.4
        run: python -m unittest discover -v
      - name: Run focused recursive E1/E2 risk tests
        working-directory: experiments/G8.4
        run: python -m unittest -v test_policy_shift_recursive_risk.py
      - name: Execute five-seed recursive risk benchmark
        working-directory: experiments/G8.4
        run: python policy_shift_recursive_risk.py --seeds 20261120,20261121,20261122,20261123,20261124 --episodes-per-cell 300 --epochs 180 --mc-samples 32 --bootstrap-replicates 2000 --out policy-shift-recursive-risk-output
      - name: Retain datasets, calibrators, horizon metrics and bootstrap intervals
        uses: actions/upload-artifact@v4
        with:
          name: g8-4-8-7-4-recursive-risk-forecasting
          path: experiments/G8.4/policy-shift-recursive-risk-output/
