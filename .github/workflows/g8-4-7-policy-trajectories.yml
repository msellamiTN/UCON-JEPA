name: G8.4.7 Policy Trajectory Dataset
on:
  push:
    branches:
      - research/g8.4.7-policy-trajectories
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-7-policy-trajectories.yml"

  workflow_dispatch:

jobs:
  policy-trajectories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Unit and regression tests
        working-directory: experiments/G8.4
        run: python -m unittest -v
      - name: Generate fixed-length policy trajectories
        working-directory: experiments/G8.4
        run: python policy_trajectory_dataset.py --seed 20261120 --episodes-per-family-policy 300 --episode-length 8 --out policy-trajectory-output
      - name: Retain policy trajectory manifest
        uses: actions/upload-artifact@v4
        with:
          name: g8-4-7-policy-trajectory-manifest
          path: experiments/G8.4/policy-trajectory-output/manifest.json
