name: G8.4.8.8 Randomized Intervention Simulator

on:
  push:
    branches:
      - research/g8.4.8.8-randomized-intervention-utility
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-8-randomized-intervention.yml"
  pull_request:
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-8-8-randomized-intervention.yml"
  workflow_dispatch:

jobs:
  randomized-intervention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Run complete G8.4 regression suite
        working-directory: experiments/G8.4
        run: python -m unittest discover -v
      - name: Run focused randomized-intervention tests
        working-directory: experiments/G8.4
        run: python -m unittest -v test_randomized_intervention_simulator.py
