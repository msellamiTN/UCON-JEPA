name: G8.2 Pilot Validation
on:
  pull_request:
    paths:
      - "experiments/G8.2/**"
      - "experiments/G8.3/**"
      - ".github/workflows/g8-pilot.yml"
  workflow_dispatch:
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --upgrade pip numpy
      - name: Unit tests
        run: python -m unittest discover -s experiments/G8.2 -p "test_*.py" -v
      - name: Smoke benchmark
        run: python experiments/G8.2/pilot_benchmark.py --seed 2026 --episodes-per-family 100 --out artifacts/g8.2-pilot
      - name: Compositional benchmark smoke run
        run: python experiments/G8.2/compositional_benchmark.py --seed 2026 --episodes-per-family 100 --out artifacts/g8.2-pilot
      - name: Reactive B0 benchmark
        run: python experiments/G8.2/reactive_b0_benchmark.py --seed 2026 --episodes-per-family 100 --out artifacts/g8.2-pilot
      - name: Mixed benign/unsafe B0 benchmark
        run: python experiments/G8.2/mixed_b0_benchmark.py --seed 2026 --episodes-per-family 100 --replicates 30 --out artifacts/g8.2-pilot
      - name: Contextual stateful policy benchmark
        run: python experiments/G8.2/contextual_benchmark.py --out artifacts/g8.2-pilot
      - name: Independent randomized policy-oracle differential audit
        run: python experiments/G8.2/independent_oracle_audit.py --seed 20261118 --cases-per-family 2000 --out artifacts/g8.2-pilot
      - name: G8.3 temporal policy reference semantics and randomized traces
        run: python -m unittest discover -s experiments/G8.3 -p "test_*.py" -v
      - name: G8.3.2 randomized temporal trace campaign
        run: python experiments/G8.3/randomized_temporal_traces.py --seed 8302 --episodes 1200 --out artifacts/g8.3.2
      - name: Upload pilot outputs
        uses: actions/upload-artifact@v4
        with:
          name: g8.2-pilot-results
          path: artifacts/g8.2-pilot/
          if-no-files-found: error
