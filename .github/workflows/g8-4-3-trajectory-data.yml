name: G8.4.3 Stateful Trajectory Dataset
on:
  push:
    branches:
      - main
      - research/g8.4.3-stateful-trajectory-dataset
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-3-trajectory-data.yml"
  pull_request:
    paths:
      - "experiments/G8.4/**"
      - ".github/workflows/g8-4-3-trajectory-data.yml"
  workflow_dispatch:

jobs:
  trajectory-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r experiments/G8.4/test-requirements.txt
      - name: Validate JEPA and trajectory data
        working-directory: experiments/G8.4
        run: python -m unittest -v
